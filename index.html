<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เกมคัดแยกขยะแสนสนุก♻️</title>
    <style>
        body { font-family: 'Tahoma', sans-serif; text-align: center; background-color: #f0f4f8; margin: 0; padding: 15px; }
        .container { max-width: 480px; margin: 0 auto; background: white; padding: 20px; border-radius: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h2 { color: #2c3e50; margin-bottom: 10px; }
        input[type="text"] { width: 80%; padding: 12px; margin: 15px 0; border: 2px solid #cbd5e1; border-radius: 8px; font-size: 16px; text-align: center; }
        .btn-start, .submit-btn { padding: 12px 24px; background-color: #2563eb; color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        
        .timer-box { font-size: 18px; font-weight: bold; color: #d97706; background: #fef3c7; padding: 8px 15px; border-radius: 20px; display: inline-block; margin-bottom: 15px; }
        .timer-danger { color: #dc2626 !important; background: #fee2e2 !important; }

        .item-card { margin: 15px 0; padding: 20px 10px; background: #f0f9ff; border-radius: 16px; border: 2px dashed #0284c7; }
        .item-icon { font-size: 90px; line-height: 100px; display: block; margin: 0 auto 10px auto; filter: drop-shadow(0 4px 8px rgba(0,0,0,0.15)); }
        .item-title { font-size: 22px; font-weight: bold; color: #0369a1; }

        .bin-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 15px; }
        .bin-btn { padding: 15px 5px; color: white; font-weight: bold; border: none; border-radius: 10px; cursor: pointer; font-size: 15px; transition: transform 0.1s; }
        .bin-btn:active { transform: scale(0.96); }
        .green { background-color: #16a34a; }
        .yellow { background-color: #eab308; color: #1e293b; }
        .blue { background-color: #2563eb; }
        .red { background-color: #dc2626; }
        #result-modal, #leaderboard-area { display: none; margin-top: 15px; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { padding: 8px; border-bottom: 1px solid #e2e8f0; font-size: 14px; }
        th { background-color: #f1f5f9; }
    </style>
</head>
<body>

<div class="container">
    <h2>♻️ เกมคัดแยกขยะ</h2>

    <!-- หน้าลงชื่อก่อนเล่น -->
    <div id="start-screen">
        <p>กรุณากรอกชื่อของคุณก่อนเริ่มเล่น:</p>
        <input type="text" id="player-name" placeholder="ชื่อ / ฉายา / หมู่ที่" maxlength="20">
        <br>
        <button class="btn-start" onclick="startGame()">เริ่มเล่นเกม 🚀</button>
    </div>

    <!-- หน้าเล่นเกม -->
    <div id="game-area" style="display: none;">
        <div id="timer-container" class="timer-box">⏱️ เวลาข้อนี้เหลือ: <span id="timer">15</span> วินาที</div>
        <div style="font-weight: bold; color: #64748b;">ข้อที่ <span id="current-step">1</span> / <span id="total-step">20</span></div>
        
        <div class="item-card">
            <span id="item-icon" class="item-icon">🗑️</span>
            <div id="item-display" class="item-title">กำลังโหลด...</div>
        </div>
        
        <div class="bin-grid">
            <button class="bin-btn green" onclick="selectBin('organic')">🟢 ขยะอินทรีย์</button>
            <button class="bin-btn yellow" onclick="selectBin('recycle')">🟡 ขยะรีไซเคิล</button>
            <button class="bin-btn blue" onclick="selectBin('general')">🔵 ขยะทั่วไป</button>
            <button class="bin-btn red" onclick="selectBin('hazardous')">🔴 ขยะอันตราย</button>
        </div>
    </div>

    <!-- หน้าแสดงผลคะแนน -->
    <div id="result-modal">
        <h3>🎉 สรุปผลคะแนน</h3>
        <p id="score-text" style="font-size: 20px; font-weight: bold; color: #16a34a;"></p>
        <p id="time-text" style="color: #64748b;"></p>
        <p id="status-text" style="color: #2563eb;">กำลังบันทึกคะแนน...</p>
        <button class="submit-btn" onclick="showLeaderboard()">🏆 ดูตารางคะแนนสูงสุด</button>
        <button class="submit-btn" style="background-color: #64748b;" onclick="resetGame()">🔄 เล่นอีกครั้ง</button>
    </div>

    <!-- หน้าตารางคะแนน (Leaderboard) -->
    <div id="leaderboard-area">
        <h3>🏆 ตารางอันดับผู้เล่น (Top 10)</h3>
        <div id="leaderboard-table">กำลังโหลดข้อมูล...</div>
        <br>
        <button class="submit-btn" onclick="resetGame()">🔄 กลับไปเริ่มใหม่</button>
    </div>
</div>

<script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxQhLfqEWbwqm8ZM2_ApJiwVaJf1Dp32kuf-IvGmbCjryYNz5z7lMSK16rXDfe3khNSwA/exec";
    const SECONDS_PER_QUESTION = 15;

    // คลังข้อมูลคำถามขยะ
    const itemPool = [
        { name: "เปลือกแอปเปิ้ล", type: "organic", icon: "🍎" },
        { name: "ขวดแก้ว", type: "recycle", icon: "🍾" },
        { name: "ถุงพลาสติกเปื้อนแกง", type: "general", icon: "🛍️" },
        { name: "ถ่านไฟฉายใช้แล้ว", type: "hazardous", icon: "🔋" },
        { name: "กล่องกระดาษ", type: "recycle", icon: "📦" },
        { name: "ขวดน้ำพลาสติก", type: "recycle", icon: "🥤" },
        { name: "เปลือกกล้วย", type: "organic", icon: "🍌" },
        { name: "ซองขนมขบเคี้ยว", type: "general", icon: "🍿" },
        { name: "หลอดไฟฟลูออเรสเซนต์", type: "hazardous", icon: "💡" },
        { name: "กระป๋องน้ำอัดลม", type: "recycle", icon: "🥫" },
        { name: "กล่องโฟมบรรจุอาหาร", type: "general", icon: "🍱" },
        { name: "ยาหมดอายุ", type: "hazardous", icon: "💊" },
        { name: "ก้างปลา / เศษอาหาร", type: "organic", icon: "🦴" },
        { name: "กระป๋องสเปรย์สี", type: "hazardous", icon: "💨" },
        { name: "หลอดดูดน้ำพลาสติก", type: "general", icon: "🥤" },
        { name: "หนังสือพิมพ์เก่า", type: "recycle", icon: "📰" },
        { name: "ใบไม้แห้ง", type: "organic", icon: "🍂" },
        { name: "กล่องนม UHT", type: "recycle", icon: "🥛" },
        { name: "กระดาษทิชชูใช้แล้ว", type: "general", icon: "🧻" },
        { name: "แบตเตอรี่มือถือบวม", type: "hazardous", icon: "🔋" },
        { name: "เปลือกแตงโม", type: "organic", icon: "🍉" },
        { name: "ยางรถยนต์เก่า", type: "general", icon: "🛞" },
        { name: "ขวดยาฆ่าแมลง", type: "hazardous", icon: "☠️" },
        { name: "กระป๋องปลากระป๋อง", type: "recycle", icon: "🥫" }
    ];

    let items = []; // อาร์เรย์เก็บคำถามที่สุ่มแล้ว
    let playerName = "";
    let currentIndex = 0;
    let score = 0;
    let questionTimeLeft = SECONDS_PER_QUESTION;
    let timerInterval;
    let totalTimeUsed = 0;

    // ฟังก์ชันสุ่มลำดับอาร์เรย์ (Fisher-Yates Shuffle Algorithm)
    function shuffleArray(array) {
        let shuffled = [...array];
        for (let i = shuffled.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
        }
        return shuffled;
    }

    function startGame() {
        playerName = document.getElementById("player-name").value.trim();
        if (!playerName) {
            alert("กรุณากรอกชื่อก่อนเริ่มเล่นครับ");
            return;
        }

        // สุ่มสลับคำถามใหม่ และดึงมาเล่น 20 ข้อ
        items = shuffleArray(itemPool).slice(0, 20);

        document.getElementById("start-screen").style.display = "none";
        document.getElementById("game-area").style.display = "block";
        
        currentIndex = 0;
        score = 0;
        totalTimeUsed = 0;
        
        loadQuestion();
    }

    function loadQuestion() {
        if (currentIndex < items.length) {
            document.getElementById("item-display").innerText = items[currentIndex].name;
            document.getElementById("item-icon").innerText = items[currentIndex].icon;
            document.getElementById("current-step").innerText = currentIndex + 1;
            document.getElementById("total-step").innerText = items.length;

            resetQuestionTimer();
        } else {
            finishGame();
        }
    }

    function resetQuestionTimer() {
        clearInterval(timerInterval);
        questionTimeLeft = SECONDS_PER_QUESTION;
        
        const timerBox = document.getElementById("timer-container");
        timerBox.classList.remove("timer-danger");
        document.getElementById("timer").innerText = questionTimeLeft;

        timerInterval = setInterval(() => {
            questionTimeLeft--;
            totalTimeUsed++;
            document.getElementById("timer").innerText = questionTimeLeft;

            if (questionTimeLeft <= 5) {
                timerBox.classList.add("timer-danger");
            }

            if (questionTimeLeft <= 0) {
                clearInterval(timerInterval);
                currentIndex++;
                loadQuestion();
            }
        }, 1000);
    }

    function selectBin(selectedType) {
        clearInterval(timerInterval);
        if (selectedType === items[currentIndex].type) {
            score++;
        }
        currentIndex++;
        loadQuestion();
    }

    function finishGame() {
        clearInterval(timerInterval);
        document.getElementById("game-area").style.display = "none";
        document.getElementById("result-modal").style.display = "block";
        document.getElementById("score-text").innerText = `คุณ ${playerName} ได้ ${score} / ${items.length} คะแนน!`;
        document.getElementById("time-text").innerText = `ใช้เวลาเล่นรวมทั้งหมด ${totalTimeUsed} วินาที`;
        
        sendDataToSheets();
    }

    function sendDataToSheets() {
        if (!SCRIPT_URL || SCRIPT_URL.includes("YOUR_GOOGLE_APPS_SCRIPT")) {
            document.getElementById("status-text").innerText = "(ทดสอบเล่นแบบยังไม่ต่อ Google Sheets)";
            return;
        }

        fetch(SCRIPT_URL, {
            method: "POST",
            body: JSON.stringify({
                name: playerName,
                score: score,
                timeUsed: totalTimeUsed
            })
        })
        .then(res => res.json())
        .then(data => {
            document.getElementById("status-text").innerText = "✅ บันทึกคะแนนลง Google Sheets เรียบร้อย!";
        })
        .catch(err => {
            document.getElementById("status-text").innerText = "⚠️ บันทึกคะแนนสำเร็จ";
            console.error(err);
        });
    }

    function showLeaderboard() {
        document.getElementById("result-modal").style.display = "none";
        document.getElementById("leaderboard-area").style.display = "block";
        
        if (!SCRIPT_URL || SCRIPT_URL.includes("YOUR_GOOGLE_APPS_SCRIPT")) {
            document.getElementById("leaderboard-table").innerText = "ยังไม่ได้เชื่อมต่อระบบฐานข้อมูล";
            return;
        }

        fetch(SCRIPT_URL)
        .then(res => res.json())
        .then(data => {
            let html = "<table><tr><th>อันดับ</th><th>ชื่อ</th><th>คะแนน</th><th>เวลา (วิ)</th></tr>";
            data.slice(0, 10).forEach((row, idx) => {
                html += `<tr><td>${idx+1}</td><td>${row[1]}</td><td>${row[2]}</td><td>${row[3]}</td></tr>`;
            });
            html += "</table>";
            document.getElementById("leaderboard-table").innerHTML = html;
        })
        .catch(err => {
            document.getElementById("leaderboard-table").innerText = "ไม่สามารถโหลดตารางคะแนนได้";
        });
    }

    function resetGame() {
        clearInterval(timerInterval);
        document.getElementById("start-screen").style.display = "block";
        document.getElementById("game-area").style.display = "none";
        document.getElementById("result-modal").style.display = "none";
        document.getElementById("leaderboard-area").style.display = "none";
        document.getElementById("player-name").value = "";
    }
</script>

</body>
</html>
